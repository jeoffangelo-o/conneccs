<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Folder – ConneCCS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body>
<div class="app-shell">
  
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="dashboard.html" class="sidebar-logo">
        <img src="images/logo.png" alt="ConneCCS Logo" class="logo-image">
        <div>
          <div>ConneCCS</div>
          <div class="sidebar-tagline">CCS Faculty Portal</div>
        </div>
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>
      <a href="reports.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14,2 14,8 20,8"/><line x1="8" y1="13" x2="16" y2="13"/>
          <line x1="8" y1="17" x2="12" y2="17"/>
        </svg>
        Reports
      </a>
      <a href="ipcr.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
        </svg>
        IPCR Monitoring
      </a>
      <a href="workload.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12,6 12,12 16,14"/>
        </svg>
        Workload
      </a>
      <a href="documents.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        Documents
      </a>

      <div class="nav-section-label">People</div>
      <a href="faculty.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Faculty
      </a>
      <a href="announcements.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        Announcements
        <span class="nav-badge">4</span>
      </a>
      <a href="messages.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Messages
      </a>
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar">D</div>
      <div class="user-info">
        <div class="user-name">Dean's Office</div>
        <div class="user-role">dean</div>
      </div>
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="user-menu-btn" title="User menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-title">Create New Folder</span>
        <span class="topbar-breadcrumb">CCS Faculty Portal › Documents › New Folder</span>
      </div>
      <div class="topbar-right">
        <a href="documents.html" class="topbar-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Back to Documents
        </a>
        <a href="messages.html" class="notif-btn" title="Messages">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="notif-badge">3</span>
        </a>
      </div>
    </div>

    <!-- Page Body -->
    <div class="page-body">
      <div class="panel fade-in" style="max-width: 700px; margin: 0 auto;">
        <div class="panel-header">
          <div class="panel-title"><span class="dot"></span> New Folder Details</div>
        </div>
        <div class="panel-body">
          <form>
            <!-- Folder Name -->
            <div class="form-group">
              <label class="form-label">Folder Name *</label>
              <input type="text" class="form-input" placeholder="Enter folder name" required>
            </div>

            <!-- Description -->
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea class="form-textarea" rows="4" placeholder="Optional folder description"></textarea>
            </div>

            <!-- Access Level -->
            <div class="form-group">
              <label class="form-label">Access Level *</label>
              <select class="form-select" required>
                <option value="">Select access level</option>
                <option value="all">All Faculty</option>
                <option value="program">Program Chair Only</option>
                <option value="dean">Dean Only</option>
                <option value="admin">Admin Only</option>
              </select>
            </div>

            <!-- Folder Color -->
            <div class="form-group">
              <label class="form-label">Folder Color</label>
              <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <label style="cursor: pointer;">
                  <input type="radio" name="color" value="blue" checked style="display: none;">
                  <div style="width: 48px; height: 48px; background: rgba(79,124,255,0.15); border: 2px solid var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                  </div>
                </label>
                <label style="cursor: pointer;">
                  <input type="radio" name="color" value="green" style="display: none;">
                  <div style="width: 48px; height: 48px; background: rgba(34,197,94,0.15); border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                  </div>
                </label>
                <label style="cursor: pointer;">
                  <input type="radio" name="color" value="red" style="display: none;">
                  <div style="width: 48px; height: 48px; background: rgba(244,63,94,0.15); border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                  </div>
                </label>
                <label style="cursor: pointer;">
                  <input type="radio" name="color" value="purple" style="display: none;">
                  <div style="width: 48px; height: 48px; background: rgba(124,92,252,0.15); border: 2px solid transparent; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                  </div>
                </label>
              </div>
            </div>

            <!-- Options -->
            <div class="form-group">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.875rem; color: var(--text2); margin-bottom: 8px;">
                <input type="checkbox" style="width: 18px; height: 18px; cursor: pointer;">
                <span>📌 Pin this folder to the top</span>
              </label>
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.875rem; color: var(--text2);">
                <input type="checkbox" style="width: 18px; height: 18px; cursor: pointer;">
                <span>🔔 Notify members when files are added</span>
              </label>
            </div>

            <!-- Submit Buttons -->
            <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
              <a href="documents.html" class="btn btn-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary">Create Folder</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="js/theme.js"></script>
<script src="js/interactions.js"></script>
</body>
</html>
