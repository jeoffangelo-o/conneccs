<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - ConneCCS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="images/logo.png" type="image/png">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <img src="images/logo.png" alt="ConneCCS Logo" style="width: 48px; height: 48px; object-fit: contain;">
          <div>
            <h1>ConneCCS</h1>
            <p>CCS Faculty Portal</p>
          </div>
        </div>
      </div>

      <div class="auth-body">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Register for a new account</p>

        <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required autofocus>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your.email@university.edu" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" class="form-select" required>
              <option value="">Select your role</option>
              <option value="faculty">Faculty</option>
              <option value="program_chair">Program Chair</option>
              <option value="dean">Dean</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
          <p>Already have an account? <a href="index.html" class="link-primary">Sign in here</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
<script src="js/interactions.js"></script>
</body>
</html>
